<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>状態遷移図・論理回路・ブロック図を無料で作成(ブラウザだけ)| 実験データ グラフ作成ツール</title>
<meta name="description" content="実験レポートの状態遷移図・ブロック図・論理回路を、ブラウザだけで無料作成。論理ゲート(AND・OR・NOT・NAND・NOR・XOR・D フリップフロップ)、縦横に自動で引ける配線、LaTeX の数式。PDF / PNG / SVG で保存。登録不要。">
<link rel="canonical" href="https://graph-tool-web.pages.dev/diagram">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/diagram.css">
<link rel="preload" href="fonts/NotoSansJP-Regular.otf" as="fetch" type="font/otf" crossorigin>
</head>
<body>
<noscript><p style="padding:16px">状態遷移図・ブロック図・論理回路をマウスで描くツールです。使うには JavaScript を有効にしてください。 <a href="help.html">使い方</a></p></noscript>
<header id="bar">
  <div class="bar-navigation">
  <a class="brand" href="./" title="トップページへ"><img src="favicon.svg" alt="" width="22" height="22"><span>グラフ作成</span></a>
  <nav class="apps" aria-label="道具を切り替える"><a href="diagram.html" class="on" aria-current="page">図の作成</a><a href="scatter.html" title="散布図はベータ版(試作版)です">散布図<small>ベータ版</small></a></nav>
  </div>
  <div class="bar-document">
  <div class="doc">
    <select id="d_pick" title="前に作った図を開きます" aria-label="開く図"></select>
    <input id="d_name" placeholder="fig1" title="新しい図は図形を置くと自動保存されます。名前が空欄なら fig1 などが自動で付き、書き出しにも使います(空白は - になります)" aria-label="名前">
    <span id="d_status"></span>
  </div>
  <div class="sp"></div>
  <button class="btn" id="d_snap" title="今の状態を残しておきます。いろいろ試したあとで「戻す」からこの状態に戻れます。">一時保存</button>
  <div class="popwrap"><button class="btn" id="d_restore" title="一時保存した状態に戻します">↩ 戻す(0)</button><div class="pop" id="p_restore"></div></div>
  <div class="popwrap"><button class="btn" id="d_file">ファイル ▾</button>
    <div class="pop" id="p_file">
      <button class="item" id="f_new">＋ 新しい図</button>
      <button class="item" id="f_dup">📄 この図を複製<br><small>まるごと「…-copy」という名前で保存して開く</small></button>
      <button class="item" id="f_merge">🧩 別の図を取り込む(合成)<br><small>選んだ図の中身を、今の図の下か右に足す</small></button>
      <div class="sepline"></div>
      <button class="item" id="m_backup">バックアップを書き出す<br><small>保存した図・グラフを 1 つのファイルにまとめて保存</small></button>
      <button class="item" id="m_restore">⬆ バックアップを読み込む<br><small>書き出したファイルから戻す</small></button>
      <input type="file" id="f_backup" accept="application/json,.json" hidden>
      <div class="sepline"></div>
      <button class="item danger" id="d_delete">🗑 この図を削除</button>
    </div>
  </div>
  <button class="btn primary" id="d_export" title="描いた範囲だけを書き出します(グリッド・下絵・選択の印は入りません)。形式と保存先は、次の画面で選べます">書き出す</button>
  <div class="popwrap"><button class="btn icon" id="d_more" title="使い方・数式の書き方・保存について" aria-label="ヘルプ">？</button>
    <div class="pop" id="p_more">
      <a class="item" href="help.html" target="_blank" rel="noopener">使い方(別のタブで開く)</a>
      <button class="item" id="m_math">∑ 数式の書き方(上付き・下付き・ギリシャ文字)</button>
      <button class="item" id="m_about">ⓘ 保存について</button>
    </div>
  </div>
  </div>
</header>
<div id="app">
  <div id="top">
    <div class="editing-actions" aria-label="編集操作">
    <button class="ib" id="b_undo" title="元に戻す(⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>戻す</button>
    <button class="ib" id="b_redo" title="やり直す(⇧⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>やり直す</button>
    <div class="sep"></div>
    <button class="ib" id="b_dup" title="複製(⌘D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>複製</button>
    <button class="ib" id="b_del" title="削除(Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>削除</button>
    <div class="sep"></div>
    <button class="ib" id="b_under" title="手書きの図や教科書の図を、なぞるための下絵として読み込みます(書き出す図には入りません)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>下絵</button>
    <input type="file" id="f_under" accept="image/*" hidden>
    </div>
    <div class="view-actions" aria-label="表示設定">
    <label class="chk" title="方眼を表示する"><input type="checkbox" id="g_show">グリッド</label>
    <label class="chk" title="図形や線をグリッドに合わせる"><input type="checkbox" id="g_snap">グリッドに吸着</label>
    <label class="chk" title="図形の辺・中心や線の端を、近くの図形の縁に合わせる"><input type="checkbox" id="g_edge_snap">図形の縁に吸着</label>
    <select id="g_size" title="グリッドの間隔"><option value="10">10</option><option value="20">20</option><option value="40">40</option></select>
    <div class="sep"></div>
    <button class="ib" id="z_out" title="縮小(− キー)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
    <button class="ib" id="z_reset" title="100% に戻す(0 キー)"><span id="zpct">100%</span></button>
    <button class="ib" id="z_in" title="拡大(+ キー)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></button>
    <button class="ib" id="z_fit" title="描いた図が全部見える大きさにする"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全体</button>
    </div>
  </div>
  <div id="main">
    <aside class="tool-panel" aria-label="作図の道具"><div class="panel-heading"><b>道具</b><span>選んで図に置く</span></div><nav class="tool-categories" aria-label="道具の種類"><button type="button" data-category="shape" aria-pressed="true">図形</button><button type="button" data-category="line" aria-pressed="false">線</button><button type="button" data-category="gate" aria-pressed="false">ゲート</button></nav><div id="palette"></div></aside>
    <div class="canvas-panel"><div class="canvas-heading"><b>作図スペース</b><span>図形を置いて、線でつなぎます</span></div><div id="wrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><textarea id="edit" rows="1"></textarea></div></div>
    <aside class="properties-panel" aria-label="選択したものの設定"><div class="panel-heading"><b>設定</b><span>選択したものを調整</span></div><div id="side"></div></aside>
  </div>
  <div id="hint"></div>
</div>

<dialog id="format_dialog" class="format-dialog" aria-labelledby="format_title">
  <h3 id="format_title">文字の書式</h3>
  <p>文字を選んで、書式を設定します。数式は <code>$...$</code> のまま入力できます。</p>
  <label for="format_text">文字</label><textarea id="format_text" rows="4"></textarea>
  <div class="format-controls" aria-label="文字の書式">
    <button type="button" class="btn" data-format="bold" title="太字"><b>太字</b></button>
    <button type="button" class="btn" data-format="italic" title="斜体">斜体</button>
    <button type="button" class="btn" data-format="underline" title="下線">下線</button>
    <button type="button" class="btn" data-format="strike" title="取り消し線">取り消し線</button>
    <label>色 <input type="color" id="format_color" value="#000000"></label>
    <label>大きさ <input type="number" id="format_size" min="6" max="96" value="22"> pt</label>
    <label>位置 <select id="format_script"><option value="normal">通常</option><option value="super">上付き</option><option value="sub">下付き</option></select></label>
    <button type="button" class="btn" data-format="clear">書式を解除</button>
  </div>
  <p class="format-message" id="format_message" aria-live="polite"></p>
  <div class="format-preview-label">見本</div><div id="format_preview" class="format-preview"></div>
  <p class="format-note">数式の一部を選んだ場合、書式は数式全体に適用します。見本は入力した記号で表示し、図と書き出しでは数式として描きます。</p>
  <div class="acts"><button type="button" class="btn" id="format_cancel">やめる</button><button type="button" class="btn primary" id="format_save">適用する</button></div>
</dialog>
<dialog id="dlg"><h3 id="dlg_t"></h3><div id="dlg_b"></div><div class="acts" id="dlg_a"></div></dialog>
<div id="toast"></div>
<div id="busy">書き出しの準備をしています…</div>
<script type="module" src="js/diagram/app.js"></script>
</body>
</html>
