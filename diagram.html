<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>図の作成 ・ 実験データ グラフ作成ツール</title>
<meta name="description" content="状態遷移図・ブロック図・論理回路などをマウスで描いて、PNG / SVG / PDF で保存できる無料のツール。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/diagram.css">
<link rel="preload" href="fonts/NotoSansJP-Regular.otf" as="fetch" type="font/otf" crossorigin>
</head>
<body>
<header id="bar">
  <a class="home" href="./" title="トップページへ">← トップ</a>
  <span class="title">図の作成</span>
  <label class="fld">開く図 <select id="d_pick" title="前に作った図を開きます"></select></label>
  <label class="fld">名前 <input id="d_name" placeholder="図形を置くと自動で決まります" title="書き出すファイルの名前にもなります(空白は - になります)"></label>
  <span id="d_status"></span>
  <div class="sp"></div>
  <div class="grp">
    <button class="btn" id="d_snap" title="今の状態を残しておきます。いろいろ試したあとで「戻す」からこの状態に戻れます。">📌 一時保存</button>
    <div class="popwrap"><button class="btn" id="d_restore">↩ 戻す(0)</button><div class="pop" id="p_restore"></div></div>
    <button class="btn danger" id="d_delete" title="この図を削除します">削除</button>
  </div>
  <div class="sep"></div>
  <div class="grp" title="図形を描いた範囲だけを書き出します(グリッド・下絵・選択の印は入りません)">
    <span class="lbl">書き出す</span>
    <button class="btn" id="x_png" title="PNG 画像(300 dpi)">PNG</button>
    <button class="btn" id="x_svg" title="SVG(拡大しても荒れない形式)">SVG</button>
    <button class="btn primary" id="x_pdf" title="PDF(LaTeX に入れるならこれがおすすめ)">PDF</button>
  </div>
  <div class="popwrap"><button class="btn" id="d_more" title="数式の書き方・バックアップ">その他 ▾</button>
    <div class="pop" id="p_more">
      <button class="item" id="m_math">∑ 数式の書き方</button>
      <button class="item" id="m_backup">⬇ バックアップを書き出す<br><small>保存した図を 1 つのファイルにまとめて保存</small></button>
      <button class="item" id="m_restore">⬆ バックアップを読み込む<br><small>書き出したファイルから図を戻す</small></button>
      <button class="item" id="m_about">ⓘ 保存について</button>
      <a class="item" href="help.html" target="_blank" rel="noopener">📖 使い方(別のタブで開く)</a>
      <input type="file" id="f_backup" accept="application/json,.json" hidden>
    </div>
  </div>
</header>
<div id="app">
  <div id="top">
    <button class="ib" id="b_undo" title="元に戻す(⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>戻す</button>
    <button class="ib" id="b_redo" title="やり直す(⇧⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>やり直す</button>
    <div class="sep"></div>
    <button class="ib" id="b_dup" title="複製(⌘D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>複製</button>
    <button class="ib" id="b_del" title="削除(Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>削除</button>
    <div class="sep"></div>
    <button class="ib" id="b_under" title="手書きの図や教科書の図を、なぞるための下絵として読み込みます(書き出す図には入りません)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>下絵</button>
    <input type="file" id="f_under" accept="image/*" hidden>
    <div class="sp"></div>
    <label class="chk" title="方眼を表示する"><input type="checkbox" id="g_show">グリッド</label>
    <label class="chk" title="図形や線の端を、グリッドや図形の輪郭に吸い付ける"><input type="checkbox" id="g_snap">吸着</label>
    <select id="g_size" title="グリッドの間隔"><option value="10">10</option><option value="20">20</option><option value="40">40</option></select>
    <div class="sep"></div>
    <button class="ib" id="z_out" title="縮小(− キー)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
    <button class="ib" id="z_reset" title="100% に戻す(0 キー)"><span id="zpct">100%</span></button>
    <button class="ib" id="z_in" title="拡大(+ キー)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></button>
    <button class="ib" id="z_fit" title="描いた図が全部見える大きさにする"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>全体</button>
  </div>
  <div id="main">
    <div id="palette"></div>
    <div id="wrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><textarea id="edit" rows="1"></textarea></div>
    <div id="side"></div>
  </div>
  <div id="hint"></div>
</div>

<dialog id="dlg"><h3 id="dlg_t"></h3><div id="dlg_b"></div><div class="acts" id="dlg_a"></div></dialog>
<div id="toast"></div>
<div id="busy">書き出しの準備をしています…</div>
<script type="module" src="js/diagram/app.js"></script>
</body>
</html>
